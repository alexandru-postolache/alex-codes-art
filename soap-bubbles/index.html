<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Soap Bubbles — Blow on the Mic</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.7/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.7/lib/addons/p5.sound.min.js"></script>
  </head>
  <body>
    <main></main>
    <div id="overlay">
      <div class="card">
        <h1>Soap Bubbles</h1>
        <p>Hold the bubble wand up close and blow gently into your microphone.</p>
        <button id="start-btn" type="button">Enable microphone</button>
        <p class="hint">Your browser will ask for mic permission. Works best with headphones to avoid feedback.</p>
      </div>
    </div>
    <script src="sketch.js"></script>
  </body>
</html>
