<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tap to Notation</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/tweakpane@3.1.0/dist/tweakpane.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.5/build/cjs/vexflow.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1>Tap to Notation</h1>
        <p class="subtitle">
          Set a tempo, tap the spacebar in rhythm, and watch your beat turn into
          sheet music.
        </p>
      </header>

      <div id="pane" class="pane"></div>

      <div class="controls-row">
        <button id="start-btn" class="btn btn-primary">Start</button>
        <button id="clear-btn" class="btn btn-secondary" disabled>Clear</button>
      </div>

      <div id="status" class="status" aria-live="polite">
        Press <kbd>Start</kbd>, then tap <kbd>Space</kbd> during recording.
      </div>

      <div id="notation" class="notation" aria-label="Music notation output"></div>

      <div class="hint">
        <p>
          <strong>How it works:</strong> 4/4 time · 2 bars · sixteenth-note
          quantization · 1-bar count-in with metronome
        </p>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
