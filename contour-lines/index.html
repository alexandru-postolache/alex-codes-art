    <meta charset="utf-8" />

  <body>
    <main></main>
    <div id="keyboard-hints" class="keyboard-hints" aria-live="polite">
      <p class="keyboard-hints__title">Keyboard</p>
      <ul class="keyboard-hints__list">
        <li><kbd>H</kbd> hide / show panel</li>
        <li><kbd>F</kbd> pause / play animation</li>
        <li><kbd>R</kbd> randomize seed</li>
        <li><kbd>N</kbd> randomize all settings</li>
        <li><kbd>S</kbd> save full canvas</li>
      </ul>
    </div>
